# forgetest: the release acceptance tool's host-side proof.
#
#  - unit tests: campaign rules, fingerprints, artifact build/verify (the
#    release gate's decision, including the negative fixtures), whether a
#    result was earned on its pins as built, the layer's manifest classes
#    run on scratch checkouts (the component entry, the layer and kas
#    hashes, the installed-file hashes), runner +
#    HTTP API end to end with a fake catalog and a fake bench tool, the
#    suites replayed on the machine's own log lines, and the check that
#    every log phrase the cloud suite greps for is one the pinned cloud
#    app can log (it reads the app sources from the manifest cache)
#  - the source bundle of a release: which recipe of the image needs
#    source, which archive answers for it, and the refusal that stops a
#    release with source missing; release.sh's gates, run on throwaway keys,
#    a scratch checkout and small images
#  - the layer's build checks (rootfs-lint.sh, image-check.py) on fixture
#    trees and images, its boot steps in a private mount namespace, its log
#    rotation under logrotate; the bench tools' heater-off and settings
#    restore paths; one fflog in the three pinned components
#  - shared UI files: theme.css and the vendored Bootstrap the page
#    carries are byte-identical to forgectrl's at its pinned revision
#  - coverage lint: every source path of every component pinned by the
#    recipes must be selected by some catalog test's coverage globs or by a
#    host-tested row naming the host test that proves it (the tree manifest
#    is generated from the pins with git - no Yocto build); enforced: an
#    uncovered path fails the job (https://docs.forgefirm.org/developers/testing/).
#  - the hold-file wire on the pair the image ships: forgectrl's
#    holds_wire_test built from forgectrl and forgeext at their pins
#
# It runs on every push to master and next, whatever the push changes: the
# release's host-test gate (scripts/host-test-gate.py) requires this
# workflow's run for the commit a release is built from. So it reads only
# commits the build pins: meta-openglow at the commit the kas lock names,
# forgectrl and forgeext at their pins. The comparisons with the extension
# catalog, whose main moves only after a release is published, are
# catalog-ci's, which the gate does not require.

name: forgetest-ci

on:
  push:
    branches: [master, next]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout forgefirm
        uses: actions/checkout@v4
        with:
          path: forgefirm

      - name: The commits the build pins (the kas lock's meta-openglow, the forgectrl and forgeext pins)
        id: pins
        working-directory: forgefirm
        run: |
          lock=$(awk '$1 == "meta-openglow:" { f = 1; next } f && $1 == "commit:" { print $2; exit } f && /^    [^ ]/ { f = 0 }' kas/forgefirm-glowforge.lock.yml)
          echo "$lock" | grep -Eqx '[0-9a-f]{40}' || { echo "the kas lock names no meta-openglow commit"; exit 1; }
          echo "meta-openglow=$lock" >> "$GITHUB_OUTPUT"
          for c in forgectrl forgeext; do
            rev=$(sed -n 's/^SRCREV = "\([0-9a-f]\{40\}\)"$/\1/p' "meta-forgefirm/recipes-forgefirm/$c/$c-pin.inc")
            echo "$rev" | grep -Eqx '[0-9a-f]{40}' || { echo "$c-pin.inc names no SRCREV"; exit 1; }
            echo "$c=$rev" >> "$GITHUB_OUTPUT"
          done

      - name: Checkout meta-openglow (sibling) at the commit the kas lock names
        uses: actions/checkout@v4
        with:
          repository: openglow-org/meta-openglow
          ref: ${{ steps.pins.outputs.meta-openglow }}
          path: meta-openglow

      - name: Checkout forgectrl at its pin
        uses: actions/checkout@v4
        with:
          repository: openglow-org/forgectrl
          ref: ${{ steps.pins.outputs.forgectrl }}
          path: forgectrl-pin

      - name: Checkout forgeext at its pin
        uses: actions/checkout@v4
        with:
          repository: openglow-org/forgeext
          ref: ${{ steps.pins.outputs.forgeext }}
          path: forgeext-pin

      - name: Build holds_wire_test from the pinned pair (forgectrl's build, forgeext's src/ as FORGEEXT_SRC)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libjansson-dev
          cmake -S forgectrl-pin -B holds-wire -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-Werror -DFORGEEXT_SRC="$PWD/forgeext-pin/src"
          cmake --build holds-wire --target holds_wire_test -j"$(nproc)"

      - name: "holds_wire_test on the pair the image ships (forgeext's holdkeep.c writing, forgectrl's holds.c reading)"
        run: ./holds-wire/holds_wire_test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tree manifest from the recipe pins (also fetches the pinned app sources the needle check reads)
        working-directory: forgefirm
        run: python scripts/manifest-from-tree.py --out tree-manifest.json

      - name: Unit tests
        working-directory: forgefirm/forgetest
        # -B: no bytecode caches under the package directory (the recipe's fetch
        # checksum would otherwise move without a source change)
        run: python -B -m unittest discover -s tests -v

      - name: No undefined names (the live drills never execute on the host)
        working-directory: forgefirm/forgetest
        # pyflakes exits 1 for any message, unused imports included, so the
        # grep is the gate. A run stopped by SIGINT exits 1 too, and its
        # "... stopped" line fails the grep. Any other status (a usage
        # error, a signal pyflakes does not handle) fails the step and
        # prints the capture, and a capture that cannot be written fails it
        # too. pyflakes ends a SIGPIPE with status 1 and no line, and a
        # write to the capture file raises none.
        run: |
          python -m pip install pyflakes
          python -B -m pyflakes --version
          { python -B -m pyflakes forgetest tests || test $? -eq 1; } > pyflakes.txt 2>&1 || { cat pyflakes.txt; exit 1; }
          if grep -E "undefined name|Traceback|^\.\.\. stopped$" pyflakes.txt; then exit 1; fi

      - name: Shared UI files match forgectrl at its pinned revision
        working-directory: forgefirm
        run: python scripts/check-ui-vendor.py

      - name: Coverage lint (enforced)
        working-directory: forgefirm/forgetest
        # The step runs under bash -e with no pipefail of its own: set here,
        # the status of the step is the lint's, not tee's.
        run: |
          set -o pipefail
          python -B -m forgetest.coverage --manifest ../tree-manifest.json --enforce | tee "$GITHUB_STEP_SUMMARY"

      - name: Gate self-check on the tree manifest
        working-directory: forgefirm
        run: |
          # The gate must load the catalog and refuse an unsigned, unauthorized
          # artifact cleanly: exit status 1, and never a traceback (Python
          # also exits 1 on an uncaught exception).
          set +e
          echo '{}' > empty.json
          python scripts/acceptance-gate.py empty.json tree-manifest.json --quiet 2> gate-stderr.txt
          rc=$?
          set -e
          cat gate-stderr.txt
          test "$rc" -eq 1
          if grep -q Traceback gate-stderr.txt; then exit 1; fi
