# forgefixture: the bench actuator's firmware, proven on the host.
#
#  - the host tests, compiled with gcc and run: the policy (channel names,
#    the loop request words, the button pulse clamp, the key comparison),
#    and the relays against a stand-in GPIO, timer and mutex layer (no
#    line written high during init, each low before its pin is an output,
#    the button refused without the
#    jumper and during a pulse, the pulse's end armed before the line
#    rises, a release that stops the pulse and drops every line)
#  - the firmware build: the whole project in the pinned ESP-IDF
#    container, with a placeholder fixture.env, so a change that does
#    not compile never reaches a bench

name: fixture-ci

on:
  push:
    branches: [master, next]
    paths:
      - 'fixture/**'
      - '.github/workflows/fixture-ci.yml'
  pull_request:
    paths:
      - 'fixture/**'
      - '.github/workflows/fixture-ci.yml'
  workflow_dispatch:

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Host tests (the policy, the relays)
        working-directory: fixture
        run: CC=gcc sh test/run.sh

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Placeholder fixture.env (the build needs one; the values are not used)
        working-directory: fixture
        run: |
          printf 'WIFI_SSID=ci-network\nWIFI_PSK=ci-passphrase\nAPI_KEY=%s\nHOSTNAME=forgefixture\n' \
            0123456789abcdef0123456789abcdef > fixture.env
      - name: Build
        working-directory: fixture
        shell: bash
        run: |
          . /opt/esp/idf/export.sh >/dev/null
          idf.py set-target esp32s3 >/dev/null
          idf.py build
      - name: Size
        working-directory: fixture
        shell: bash
        run: |
          . /opt/esp/idf/export.sh >/dev/null
          idf.py size | tail -n 20
